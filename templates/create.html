<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Letter 💌</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 520px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #d63384;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        input[type="file"] {
            background: #fff;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #d63384;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #linkBox {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff0f5;
            border-radius: 12px;
        }

        #letterLink {
            word-break: break-all;
            color: #d63384;
            font-weight: bold;
        }

        #copyBtn {
            background: #6f42c1;
        }

        #previewBtn {
            background: #198754;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💌 Create Your Letter</h1>

    <label>Set Your PIN 🔐</label>
    <input
        type="password"
        id="pin"
        maxlength="4"
        inputmode="numeric"
        placeholder="Enter 4 digit PIN"
    >

    <label>Title ❤️</label>
    <input
        type="text"
        id="title"
        placeholder="Example: For Someone Special ❤️"
    >

    <label>Your Message 💌</label>
    <textarea
        id="message"
        placeholder="Write your message here..."
    ></textarea>

    <label>Love Line 1 💓</label>
    <input
        type="text"
        id="love_line_1"
        value="I really love you 💓"
    >

    <label>Love Line 2 ❤️</label>
    <input
        type="text"
        id="love_line_2"
        value="you are my everything❤️"
    >

    <label>Signature ✨</label>
    <input
        type="text"
        id="signature"
        value="Always yours ❤️"
    >

    <label>Choose Your Song 🎵</label>
    <input
        type="file"
        id="songFile"
        accept="audio/*"
    >

    <button onclick="createLetter()">
        💖 Create My Letter
    </button>

    <div id="linkBox">

        <strong>🎉 Your letter has been created!</strong>

        <p>
            🔗 Your unique letter link:
        </p>

        <p id="letterLink"></p>

        <button id="copyBtn" onclick="copyLink()">
            📋 Copy Link
        </button>

        <button id="previewBtn" onclick="previewLetter()">
            👀 Preview Your Letter
        </button>

    </div>

</div>


<script>

let generatedLink = "";
let previewLink = "";


async function createLetter() {

    const pin =
        document.getElementById("pin").value.trim();

    const title =
        document.getElementById("title").value.trim();

    const message =
        document.getElementById("message").value.trim();

    const loveLine1 =
        document.getElementById("love_line_1").value.trim();

    const loveLine2 =
        document.getElementById("love_line_2").value.trim();

    const signature =
        document.getElementById("signature").value.trim();

    const songFile =
        document.getElementById("songFile").files[0];


    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {

        alert("Please enter a 4 digit PIN.");

        return;
    }


    if (!title || !message) {

        alert("Please fill Title and Message.");

        return;
    }


    if (!songFile) {

        alert("Please choose a song 🎵");

        return;
    }


    const formData = new FormData();

    formData.append("pin", pin);
    formData.append("title", title);
    formData.append("message", message);
    formData.append("love_line_1", loveLine1);
    formData.append("love_line_2", loveLine2);
    formData.append("signature", signature);
    formData.append("song", songFile);


    try {

        const response = await fetch("/api/create", {

            method: "POST",

            body: formData

        });


        const result = await response.json();


        if (result.ok) {

            generatedLink =
                window.location.origin + result.url;

            previewLink =
                window.location.origin + result.preview_url;


            document.getElementById("letterLink").textContent =
                generatedLink;


            document.getElementById("linkBox").style.display =
                "block";


            alert("Your letter has been created! ❤️");

        } else {

            alert(
                result.error ||
                "Something went wrong."
            );
        }


    } catch (error) {

        console.error(error);

        alert(
            "Server error. Please try again."
        );
    }
}


function copyLink() {

    if (!generatedLink) return;


    navigator.clipboard.writeText(generatedLink)

        .then(() => {

            alert("Link copied! ❤️");

        })

        .catch(() => {

            alert(
                "Link copy nahi hua. Manually copy kar lo."
            );

        });
}


function previewLetter() {

    if (!previewLink) return;

    window.open(
        previewLink,
        "_blank"
    );
}

</script>

</body>
</html>
