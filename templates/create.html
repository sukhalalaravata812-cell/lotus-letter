<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Letter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #d63384;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #d63384;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #linkBox {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff0f5;
            border-radius: 12px;
        }

        #letterLink {
            word-break: break-all;
            color: #d63384;
            font-weight: bold;
        }

        #copyBtn {
            background: #6f42c1;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💌 Create Your Letter</h1>

    <label>Set Your PIN</label>

    <input
        type="password"
        id="pin"
        maxlength="4"
        inputmode="numeric"
        placeholder="Enter 4 digit PIN"
    >

    <label>Title</label>

    <input
        type="text"
        id="title"
        placeholder="Example: For Someone Special ❤️"
    >

    <label>Your Message</label>

    <textarea
        id="message"
        placeholder="Write your message here..."
    ></textarea>

    <label>Choose Your Song 🎵</label>

    <input
        type="file"
        id="songFile"
        accept="audio/*"
    >

    <button onclick="createLetter()">
        💖 Create My Letter
    </button>


    <div id="linkBox">

        <strong>🎉 Your unique letter link:</strong>

        <p id="letterLink"></p>

        <button id="copyBtn" onclick="copyLink()">
            📋 Copy Link
        </button>

    </div>

</div>


<script>

let generatedLink = "";


async function createLetter() {

    const pin =
        document.getElementById("pin").value.trim();

    const title =
        document.getElementById("title").value.trim();

    const message =
        document.getElementById("message").value.trim();


    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {

        alert("Please enter a 4 digit PIN.");

        return;
    }


    if (!title || !message) {

        alert("Please fill all fields.");

        return;
    }


    try {

        const response = await fetch("/api/create", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                pin: pin,

                title: title,

                message: message

            })

        });


        const result = await response.json();


        if (result.ok) {

            generatedLink =
                window.location.origin + result.url;


            document.getElementById("letterLink").textContent =
                generatedLink;


            document.getElementById("linkBox").style.display =
                "block";


            alert("Your letter has been created! ❤️");
            setTimeout(() => {
    window.location.href = generatedLink;
}, 1000);


        } else {

            alert(
                result.error ||
                "Something went wrong."
            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "Server error. Please try again."
        );

    }

}


function copyLink() {

    if (!generatedLink) {
        return;
    }


    navigator.clipboard.writeText(
        generatedLink
    )
    .then(() => {

        alert("Link copied! ❤️");

    })
    .catch(() => {

        alert(
            "Link copy nahi hua. Manually copy kar lo."
        );

    });

}

</script>

</body>

</html>
