<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Letter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #d63384;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #d63384;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💌 Create Your Letter</h1>

    <label>Set Your PIN</label>
    <input
        type="password"
        id="pin"
        maxlength="4"
        placeholder="Enter 4 digit PIN">

    <label>Title</label>
    <input
        type="text"
        id="title"
        placeholder="Example: For Someone Special ❤️">

    <label>Your Message</label>
    <textarea
        id="message"
        placeholder="Write your message here..."></textarea>

        <label>Choose Your Song 🎵</label>
<input
    type="file"
    id="songFile"
    accept="audio/*">
    
    <button onclick="createLetter()">
        💖 Create My Letter
    </button>

</div>

<script>

function createLetter() {

    const pin = document.getElementById("pin").value;
    const title = document.getElementById("title").value;
    const message = document.getElementById("message").value;
    const songFile = document.getElementById("songFile").files[0];

    if (pin.length !== 4) {
        alert("Please enter a 4 digit PIN.");
        return;
    }

    if (!title || !message) {
        alert("Please fill all fields.");
        return;
    }

    localStorage.setItem("customPin", pin);
    localStorage.setItem("customTitle", title);
    localStorage.setItem("customMessage", message);

    if (songFile) {
        const reader = new FileReader();

        reader.onload = function () {
            localStorage.setItem("customSong", reader.result);
            window.location.href = "/";
        };

        reader.readAsDataURL(songFile);

    } else {
        window.location.href = "/";
    }
}
